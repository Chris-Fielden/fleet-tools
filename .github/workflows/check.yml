# Server-side run of scripts/check.sh, independent of any agent's machine.
# No secrets are used. Actions are pinned to full commit SHAs.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v4.2.2. Full history so gitleaks can scan every commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      # Same version and checksum verification as SETUP-GUIDE.md, Step 2b.
      - name: Install gitleaks
        env:
          V: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSLO "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_${V}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${V}_checksums.txt"
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: scripts/check.sh
        run: bash scripts/check.sh
